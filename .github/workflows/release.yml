name: Release

on:
  push:
    branches:
      - release/15.9.0

permissions:
  contents: read

jobs:
  reference-seller-interop:
    name: Reference seller interop
    permissions:
      contents: read
    uses: ./.github/workflows/interop-python.yml

  release:
    name: Release
    needs: reference-seller-interop
    if: github.ref == 'refs/heads/release/15.9.0'
    concurrency:
      # npm publishing and dist-tag updates mutate package-global state.
      # Serialize those mutations across main and maintenance releases.
      group: npm-release-dist-tags
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      ADCP_REQUIRE_SIGNATURE: '1'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Mint an AAO IPR Bot installation token so events created by this
      # workflow (the release-PR branch push and the "chore: release package"
      # PR itself) trigger downstream workflows. GitHub suppresses workflow
      # triggers for events authored by the default GITHUB_TOKEN, which left
      # the release PR permanently BLOCKED on the pull_request_target-based
      # `IPR Policy / Signature` required check — it never fired, so only an
      # admin bypass could merge. An App identity's events are not suppressed.
      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.IPR_APP_ID }}
          private-key: ${{ secrets.IPR_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify isolated release snapshot
        run: |
          node -e "if (require('./package.json').version !== '15.9.0') throw new Error('This branch may only publish SDK 15.9.0')"
          # The version commit is immutable; only the five qualification workflows may differ.
          git diff --exit-code 9343eb2dbdd28b7d8d32822f2b2b2a50a9ef465a HEAD -- . \
            ':(exclude).github/workflows/release.yml' \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude).github/workflows/codeql.yml' \
            ':(exclude).github/workflows/interop-python.yml' \
            ':(exclude).github/workflows/changeset-check.yml'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build
        run: npm run build:lib

      - name: Verify npm publication scope and latest
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readdirSync } = require('node:fs');
          const semver = require('semver');
          const view = (spec) => JSON.parse(execFileSync('npm', ['view', spec, 'version', '--json'], { encoding: 'utf8' }));
          const latest = view('@adcp/sdk@latest');
          if (!semver.valid(latest) || semver.gt(latest, '15.9.0')) {
            throw new Error(`Refusing to replace SDK latest ${latest} with 15.9.0`);
          }
          for (const dir of readdirSync('./packages', { withFileTypes: true })) {
            if (!dir.isDirectory()) continue;
            const pkg = require(`./packages/${dir.name}/package.json`);
            if (pkg.private || pkg.name === '@adcp/client') continue;
            if (view(`${pkg.name}@${pkg.version}`) !== pkg.version) {
              throw new Error(`Only SDK 15.9.0 may be newly published: ${pkg.name}@${pkg.version} is missing`);
            }
          }
          NODE

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: npm run version
          publish-script: npm run release
          pr-title: 'chore: release package'
          commit-message: 'chore: release package'
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub releases with bounded notes
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const createReleases = require('./.github/scripts/create-package-releases.cjs');
            await createReleases({ github, context, core, publishedPackages: JSON.parse(process.env.PUBLISHED_PACKAGES) });

      # `npm deprecate '@adcp/client@…'` is run manually post-release for now.
      # OIDC trusted-publishing tokens are scoped to the publishing package, so
      # the token issued for @adcp/sdk's publish does not have deprecate rights
      # on @adcp/client. Once we provision a maintainer NPM_TOKEN secret with
      # deprecate scope on @adcp/client, this step can land back here. See the
      # PR description for the manual-deprecate snippet to run after release.
