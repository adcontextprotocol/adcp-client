name: Release

on:
  push:
    branches:
      - main
      - 13.x

concurrency:
  # Dist-tags are package-global state. Serialize main and maintenance
  # releases so an older branch cannot race a newer branch's latest update.
  group: npm-release-dist-tags
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reference-seller-interop:
    name: Reference seller interop
    permissions:
      contents: read
    uses: ./.github/workflows/interop-python.yml

  release:
    name: Release
    needs: reference-seller-interop
    runs-on: ubuntu-latest
    env:
      ADCP_REQUIRE_SIGNATURE: '1'
      # Stable-line releases must create/move their compatibility tag as part
      # of npm publish. The empty main value is intentional: the publish
      # wrapper then honors Changesets rc/pre-mode instead of forcing latest.
      ADCP_NPM_TAG: ${{ github.ref_name == '13.x' && 'adcp-3.1' || '' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Mint an AAO IPR Bot installation token so events created by this
      # workflow (the release-PR branch push and the "chore: release package"
      # PR itself) trigger downstream workflows. GitHub suppresses workflow
      # triggers for events authored by the default GITHUB_TOKEN, which left
      # the release PR permanently BLOCKED on the pull_request_target-based
      # `IPR Policy / Signature` required check — it never fired, so only an
      # admin bypass could merge. An App identity's events are not suppressed.
      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.IPR_APP_ID }}
          private-key: ${{ secrets.IPR_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build
        run: npm run build:lib

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: 'chore: release package'
          commit: 'chore: release package'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Reconcile stable-line latest policy
        if: steps.changesets.outputs.published == 'true' && github.ref_name == '13.x'
        run: node scripts/report-dist-tag-policy.mjs --apply
        env:
          # Never infer this from the checkout: Changesets may publish a
          # workspace package without publishing the root SDK package.
          ADCP_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          # OIDC remains authoritative for the adcp-3.1 publish. A classic
          # token is used only for the guarded second-tag move. If latest
          # should move and this secret is absent, the step reports the exact
          # recovery command and fails instead of silently green-lighting a
          # partially completed release.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `npm deprecate '@adcp/client@…'` is run manually post-release for now.
      # OIDC trusted-publishing tokens are scoped to the publishing package, so
      # the token issued for @adcp/sdk's publish does not have deprecate rights
      # on @adcp/client. Once we provision a maintainer NPM_TOKEN secret with
      # deprecate scope on @adcp/client, this step can land back here. See the
      # PR description for the manual-deprecate snippet to run after release.
