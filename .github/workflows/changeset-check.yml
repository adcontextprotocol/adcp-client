name: changeset-check

on:
  pull_request:
    branches: [main, 15.2.x]

permissions:
  contents: read

jobs:
  check:
    name: Check for changeset
    runs-on: ubuntu-latest
    env:
      CHANGES_BASE_BRANCH: ${{ github.base_ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect release metadata-only change
        id: release-metadata
        run: |
          changed_files="$(git diff --name-only "origin/${CHANGES_BASE_BRANCH}...HEAD")"
          package_changes="$(
            printf '%s\n' "$changed_files" |
              grep -Ev '^(\.changeset/(pre\.json|[^/]+\.md)|CHANGELOG\.md|package(-lock)?\.json|packages/[^/]+/(CHANGELOG\.md|package\.json)|src/lib/version\.ts|docs/(llms\.txt|TYPE-SUMMARY\.md|migration-14\.x-rc-worksheet\.md)|\.github/workflows/(changeset-check|release)\.yml)$' ||
              true
          )"

          if [ -z "$package_changes" ]; then
            if printf '%s\n' "$changed_files" | grep -qx 'src/lib/version.ts'; then
              node -e '
                const fs = require("node:fs");
                const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                const source = fs.readFileSync("src/lib/version.ts", "utf8");
                const quote = String.fromCharCode(39);
                const hasLibraryVersion = source.includes(`LIBRARY_VERSION = ${quote}${pkg.version}${quote}`);
                const hasVersionInfoLibrary = source.includes(`library: ${quote}${pkg.version}${quote}`);

                if (!hasLibraryVersion || !hasVersionInfoLibrary) {
                  console.error(
                    `src/lib/version.ts is not synced with package.json version ${pkg.version}.`
                  );
                  process.exit(1);
                }
              '
            fi

            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only release metadata changed; changeset not required."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.release-metadata.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        if: steps.release-metadata.outputs.skip != 'true'
        run: npm ci

      - name: Check for changeset
        if: steps.release-metadata.outputs.skip != 'true'
        run: npx changeset status --since="origin/${CHANGES_BASE_BRANCH}"
