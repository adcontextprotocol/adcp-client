name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-checks:
    name: Generated, Docs & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check code formatting
        run: npm run format:check

      - name: Lint GitHub Actions workflows
        run: npm run lint:workflows

      # Run before the producer gates unit shards, which also discover this test.
      - name: Test CI artifact contract
        run: node --test test/ci-artifact-reuse.test.js

      - name: Sync schemas from AdCP
        id: schema-sync
        run: npm run sync-schemas:all

      - name: Report immutable protocol bundle provenance
        if: steps.schema-sync.outputs.primary_schema_source == 'bundle'
        env:
          PROTOCOL_COMMIT: ${{ steps.schema-sync.outputs.protocol_commit }}
          BUNDLE_SHA256: ${{ steps.schema-sync.outputs.bundle_sha256 }}
          BUNDLE_VERSION: ${{ steps.schema-sync.outputs.bundle_version }}
        run: |
          {
            echo '### Immutable protocol PR bundle'
            echo
            echo "- Published version: \`${BUNDLE_VERSION}\`"
            echo "- Protocol commit: \`${PROTOCOL_COMMIT}\`"
            echo "- Bundle SHA-256: \`${BUNDLE_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated files are in sync
        env:
          ADCP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ADCP_PRIMARY_SCHEMA_SOURCE: ${{ steps.schema-sync.outputs.primary_schema_source }}
        run: |
          generated_paths=(
            schemas/codegen-provenance.json
            ':(glob)src/lib/types/*.generated.ts'
            src/lib/types/v2-5/tools.generated.ts
            src/lib/agents/index.generated.ts
            src/lib/media-buy/update-fields.generated.ts
            src/lib/media-buy/action-metadata.generated.ts
            src/lib/server/decisioning/runtime/entity-hydration.generated.ts
            src/lib/registry/types.generated.ts
            schemas/registry/registry.yaml
          )
          primary_generated_paths=(
            ':(glob)src/lib/types/*.generated.ts'
            src/lib/agents/index.generated.ts
            src/lib/media-buy/update-fields.generated.ts
            src/lib/media-buy/action-metadata.generated.ts
            src/lib/server/decisioning/runtime/entity-hydration.generated.ts
          )

          primary_schema_version="$(tr -d '[:space:]' < ADCP_VERSION)"
          if [[ "$ADCP_PRIMARY_SCHEMA_SOURCE" == "github" && "$primary_schema_version" == "3.2.0-beta.0" ]]; then
            echo "::warning::Primary AdCP schema host was unavailable; skipping primary codegen drift assertion against the known non-equivalent v3.2.0-beta.0 fallback bundle."
            if [[ -z "$ADCP_BASE_SHA" ]] || ! git cat-file -e "$ADCP_BASE_SHA^{commit}"; then
              echo "::error::Cannot verify the primary-codegen fallback scope against base commit '$ADCP_BASE_SHA'."
              exit 1
            fi
            if ! git diff --quiet "$ADCP_BASE_SHA" HEAD -- \
              "${primary_generated_paths[@]}" \
              ':(glob)scripts/generate-*.ts' \
              scripts/schema-utils.ts \
              scripts/schema-cache-ref.ts \
              scripts/lib/error-code-prose-overlays.ts \
              ADCP_VERSION \
              package.json \
              package-lock.json; then
              echo "::error::Primary generated files or codegen inputs changed while their canonical schema source was unavailable."
              git diff --name-only "$ADCP_BASE_SHA" HEAD -- \
                "${primary_generated_paths[@]}" \
                ':(glob)scripts/generate-*.ts' \
                scripts/schema-utils.ts \
                scripts/schema-cache-ref.ts \
                scripts/lib/error-code-prose-overlays.ts \
                ADCP_VERSION \
                package.json \
                package-lock.json
              exit 1
            fi
            generated_paths=(
              src/lib/types/v2-5/tools.generated.ts
              src/lib/registry/types.generated.ts
              schemas/registry/registry.yaml
            )
          else
            npm run generate-types
            npm run generate-wellknown-schemas
          fi
          npm run generate-types:v2.5
          npm run generate-registry-types -- --sync

          if ! git diff --exit-code -I '// Generated at:' -- "${generated_paths[@]}" 2>/dev/null; then
            echo ""
            echo "❌ Generated TypeScript files are out of sync with AdCP schemas or registry OpenAPI!"
            echo ""
            echo "📋 Changes detected in:"
            git diff --name-only -- "${generated_paths[@]}" 2>/dev/null || true
            echo ""
            echo "🔧 To fix, run locally:"
            echo "  npm run sync-schemas:all"
            echo "  npm run generate-types:all"
            echo "  npm run generate-wellknown-schemas"
            echo "  npm run generate-registry-types -- --sync"
            echo ""
            echo "Then commit the updated generated files."
            exit 1
          fi

          echo "✅ Generated files are in sync with schemas"

      - name: Codegen strictness — no loose oneOf arms
        run: npm run ci:codegen-strict

      - name: Check protocol-managed skills present and paths resolve
        run: npm run check:skill-sync

      - name: Validate agent docs are in sync
        run: npm run ci:docs-check

      - name: Check SDK→docs URLs resolve (URL-rot guard)
        run: npm run ci:doc-links

  typescript-typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

  # Build once from this run's checkout. Include the schema/compliance caches
  # prepared by schemas:ensure: codegen and protocol tests read those fixtures
  # directly, including their versioned trees and relative latest symlinks.
  # Consumers: unit shards/slow tests and webhook/ESLint contracts use the build;
  # adopter/example typechecks read its declarations. Network matrix cells test
  # runtime dependencies (tsup keeps external imports), including the Undici 7
  # packed-consumer override. Package/export checks consume the same tree.
  # Rebuilders: this producer, package-smoke, and package-mode Node floor cells
  # validate generation/packing under their own runtime. Example integration
  # retains its pretest:examples build and remains an independent early lane.
  # generated-checks and source typechecking also stay independent. Keep slow
  # package/export validation out of the producer so it cannot delay all tests.
  library-build:
    name: Library Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
      commit: ${{ steps.archive.outputs.commit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Archive library output and emit independent digest
        id: archive
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Library Build checkout does not match this workflow run."
            exit 1
          fi
          # Consumers read these tracked sources without rerunning generators.
          # Fail before publication if the build would leave source/dist skew.
          if ! git diff --exit-code -- src/lib/version.ts src/lib/server/wire-spec-fields.generated.ts; then
            echo "::error::Commit regenerated library sources before sharing this build."
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/library-dist.tar.gz" dist schemas/cache compliance/cache
          digest=$(sha256sum "$RUNNER_TEMP/library-dist.tar.gz" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload library output
        uses: actions/upload-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-dist.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          # A full rerun replaces the prior attempt. Partial reruns can reuse
          # the successful producer's output; a missing/expired artifact fails.
          overwrite: true

  library-checks:
    name: Library Package Checks
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No token, repository or run-id override: download only from this run.
      # The digest comes from the producer job, never from inside the artifact.
      # An absent/expired artifact fails the download itself: rerun all jobs
      # to recreate it after the one-day retention window.
      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Guard public Zod OpenAPI portability
        run: npm run test:zod-openapi-portability

      - name: Enforce publish-size budgets
        run: npm run check:package-size

      - name: Validate package exports
        run: |
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');

            if (!fs.existsSync(pkg.main)) {
              throw new Error('Main export file does not exist: ' + pkg.main);
            }
            if (!fs.existsSync(pkg.types)) {
              throw new Error('Types export file does not exist: ' + pkg.types);
            }
            console.log('✅ Package exports are valid');
          "

      - name: Static export-map checks (publint + attw)
        run: npm run check:package

  # Clean-room dual-format smoke: install the packed tarball with peers at their
  # range floors and load it via real ESM + CJS. This does a live registry
  # install, so the expensive steps run only when a packaging-relevant file
  # changed. The job itself always completes (skipped steps = success), so it is
  # safe to require via the `test` aggregator and never hangs pending.
  package-smoke:
    name: Package Artifact Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect packaging-relevant changes
        id: detect
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # No usable base (first push, force-push, scheduled run) — run to be safe.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(ADCP_VERSION|package\.json|package-lock\.json|tsup\.config\.ts|tsconfig\.json|tsconfig\.lib\.json|tsconfig\.build\.json|scripts/(generate-dmts-declarations|generate-per-tool-types|copy-schemas-to-dist|copy-v2-projection-catalog|generate-wire-spec-fields|compact-schema-bundle)\.ts|scripts/(verify-package|check-package-size|check-publish-protocol-artifacts)\.mjs|src/lib/(validation/(bundled-schema-store|schema-loader)|conformance/schemaLoader|server/error-arm-tools)\.ts|\.github/workflows/ci\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No packaging-relevant changes; skipping the clean-room smoke."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup pnpm release-age resolver
        if: steps.detect.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          # Exact-version minimumReleaseAge exclusions landed in pnpm 10.19;
          # stay on v10 so this smoke still exercises the SDK's Node 20 floor.
          version: 10.19.0

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: npm ci

      - name: Build library
        if: steps.detect.outputs.changed == 'true'
        run: npm run build:lib

      - name: Clean-room dual-format smoke (packed artifact + peer floors)
        if: steps.detect.outputs.changed == 'true'
        run: npm run verify:package

  adopter-typechecks:
    name: Adopter Typechecks
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Adopter type-check (catch d.ts leaks)
        run: npm run check:adopter-types

      - name: Adopter type-check — narrow per-tool imports (#1944)
        run: npm run check:adopter-types-narrow
        timeout-minutes: 10

  example-typechecks:
    name: Example Typechecks
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Typecheck examples
        run: npm run typecheck:examples

      - name: Typecheck skill code samples
        run: npm run typecheck:skill-examples

  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    needs:
      - typescript-typecheck
      - library-build
      - library-checks
      - adopter-typechecks
      - example-typechecks
    if: ${{ always() }}
    timeout-minutes: 2

    steps:
      - name: Verify typecheck and build lanes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs).filter(([, job]) => job.result !== 'success');

          if (failed.length > 0) {
            console.error('One or more typecheck/build lanes failed:');
            for (const [name, job] of failed) {
              console.error(`- ${name}: ${job.result}`);
            }
            process.exit(1);
          }

          console.log('All typecheck/build lanes passed.');
          NODE

  unit-tests-fast:
    name: Unit Tests Fast (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Run fast unit test shard
        run: node scripts/run-test-with-summary.js --title "Unit Tests Fast $TEST_SHARD" -- npm run test:node:fast:shard
        env:
          CI: true
          TEST_SHARD: ${{ matrix.shard }}

  unit-tests-slow:
    name: Unit Tests Slow
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Run slow unit tests
        run: node scripts/run-test-with-summary.js --title "Unit Tests Slow" -- npm run test:node:slow
        env:
          CI: true

  webhook-delivery-backends:
    name: Webhook Delivery Backends
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Run durable webhook backend contract
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          REDIS_URL: redis://127.0.0.1:6379
        run: node --test test/lib/webhook-delivery-durability.test.js

      - name: Run durable webhook registration backend contract
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          REDIS_URL: redis://127.0.0.1:6379
        run: node --test --test-timeout=120000 test/lib/webhook-registration-durability.test.js

      - name: Run PostgreSQL decisioning backend contracts
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          REPORTING_LEDGER_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
          REPORTING_LIFECYCLE_PG_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: >-
          node --test --test-timeout=120000
          test/server-decisioning-postgres-task-registry.test.js
          test/server-decisioning-postgres-task-settlement-intents.test.js
          test/lib/postgres-proposal-store.test.js
          test/lib/reporting-ledger-pg.test.js
          test/lib/reporting-status-ingest-pg.test.js
          test/reliable-reporting-lifecycle-pg.test.js

  eslint-plugin-tests:
    name: ESLint Plugin Tests
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Run ESLint plugin tests
        run: node scripts/run-test-with-summary.js --title "ESLint Plugin Tests" -- npm test --workspace=packages/eslint-plugin --if-present
        env:
          CI: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs:
      - unit-tests-fast
      - unit-tests-slow
      - eslint-plugin-tests
    if: ${{ always() }}
    timeout-minutes: 2

    steps:
      - name: Verify unit test lanes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs).filter(([, job]) => job.result !== 'success');

          if (failed.length > 0) {
            console.error('One or more unit test lanes failed:');
            for (const [name, job] of failed) {
              console.error(`- ${name}: ${job.result}`);
            }
            process.exit(1);
          }

          console.log('All unit test lanes passed.');
          NODE

  example-integration-tests:
    name: Example Adapter Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run example adapter integration tests
        run: npm run test:examples
        env:
          CI: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          npm audit || true

          if npm audit --audit-level=high 2>/dev/null; then
            echo "✅ No high or critical vulnerabilities found"
          else
            echo "❌ High or critical vulnerabilities found"
            npm audit --audit-level=high
            exit 1
          fi

  # Separate package and network matrices: job-level needs cannot vary by
  # matrix.mode. Node-floor builds must start without waiting on the producer.
  node-undici-runtime-matrix:
    name: Node ${{ matrix.node }} / Undici ${{ matrix.undici }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            undici: 6.28.0
            mode: package
          - node: 22.12.0
            undici: 6.28.0
            mode: package

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup pnpm release-age resolver
        uses: pnpm/action-setup@v4
        with:
          # verify:package exercises the SDK under pnpm's release-age policy.
          # Pin the same Node-20-compatible resolver used by package-smoke.
          version: 10.19.0

      - name: Install dependencies with tested Undici
        run: |
          npm ci
          npm install --no-save --package-lock=false "undici@${{ matrix.undici }}"

      - name: Check declared runtime policy
        run: npm run check:runtime-compat

      - name: Build library
        run: npm run build:lib

      - name: Published-package floor smoke
        if: matrix.mode == 'package'
        run: npm run verify:package

  # These cells deliberately test Node-20-built output under Node 24 / Undici 7,
  # including the packed Undici 7 override at Node 20.19.0. Build-toolchain
  # compatibility is checked at the two Node floors in the package matrix;
  # network cells no longer exercise code generation under their own runtime.
  node-undici-network-matrix:
    name: Node ${{ matrix.node }} / Undici ${{ matrix.undici }}
    runs-on: ubuntu-latest
    needs: library-build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            undici: 7.29.0
            mode: network
          - node: 24.x
            undici: 6.28.0
            mode: network

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup pnpm release-age resolver
        uses: pnpm/action-setup@v4
        with:
          # verify:package exercises the SDK under pnpm's release-age policy.
          # Pin the same Node-20-compatible resolver used by package-smoke.
          version: 10.19.0

      - name: Install dependencies with tested Undici
        run: |
          npm ci
          npm install --no-save --package-lock=false "undici@${{ matrix.undici }}"

      - name: Check declared runtime policy
        run: npm run check:runtime-compat

      - name: Download library output
        uses: actions/download-artifact@v7
        with:
          name: library-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/library-artifact

      - name: Verify and extract library output
        shell: bash
        env:
          LIBRARY_SHA256: ${{ needs.library-build.outputs.sha256 }}
          LIBRARY_COMMIT: ${{ needs.library-build.outputs.commit }}
        run: |
          if [[ ! "$LIBRARY_SHA256" =~ ^[0-9a-f]{64}$ || "$LIBRARY_COMMIT" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Missing library-build digest or checkout identity mismatch."
            exit 1
          fi
          archive="$RUNNER_TEMP/library-artifact/library-dist.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Missing library-build artifact (expires after 1 day). Use Re-run all jobs."
            exit 1
          fi
          if ! echo "$LIBRARY_SHA256  $archive" | sha256sum --check --status; then
            echo "::error::Library artifact SHA-256 mismatch. Refusing to use unverified output."
            exit 1
          fi
          rm -rf dist schemas/cache compliance/cache
          tar -xzf "$archive"

      - name: Published-package Undici 7 consumer override
        if: matrix.undici == '7.29.0'
        env:
          ADCP_UNDICI_OVERRIDE: 7.29.0
        run: npm run verify:package

      - name: Network-sensitive SDK suites
        if: matrix.mode == 'network'
        env:
          NODE_ENV: test
        run: >-
          node --test --test-timeout=120000
          test/lib/pin-and-bind-fetch.test.js
          test/lib/protocol-detection.test.js
          test/lib/protocol-detection-1612.test.js
          test/lib/protocol-detection-toctou.test.js
          test/lib/mcp-oauth-scoped-fetch.test.js
          test/lib/webhook-emitter.test.js
          test/unit/oauth-size-limit.test.js
          test/unit/response-size-limit.test.js

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    needs:
      - generated-checks
      - typecheck-build
      - unit-tests
      - webhook-delivery-backends
      - example-integration-tests
      - security-audit
      - package-smoke
      - node-undici-runtime-matrix
      - node-undici-network-matrix
    if: ${{ always() }}
    timeout-minutes: 2

    steps:
      - name: Verify CI lanes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs).filter(([, job]) => job.result !== 'success');

          if (failed.length > 0) {
            console.error('One or more CI lanes failed:');
            for (const [name, job] of failed) {
              console.error(`- ${name}: ${job.result}`);
            }
            process.exit(1);
          }

          console.log('All CI lanes passed.');
          NODE
