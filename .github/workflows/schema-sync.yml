name: Schema Synchronization

on:
  schedule:
    # Run daily at 6 AM UTC to check for schema updates
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      force_update:
        description: 'Force update even if schemas are unchanged'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  auto-update-schemas:
    name: Auto-update Schemas (Scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_update == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sync schemas and check for updates
        id: sync
        env:
          ADCP_REQUIRE_SIGNATURE: '1'
        run: |
          npm run sync-schemas:all
          npm run generate-types:all
          npm run generate-wellknown-schemas
          npm run generate-registry-types -- --sync
          npm run generate-agent-docs
          npm run generate-release-worksheet
          npm run sync-version -- --force

          generated_paths=(
            schemas/codegen-provenance.json
            ':(glob)src/lib/types/*.generated.ts'
            src/lib/types/v2-5/tools.generated.ts
            src/lib/agents/index.generated.ts
            src/lib/media-buy/update-fields.generated.ts
            src/lib/media-buy/action-metadata.generated.ts
            src/lib/server/decisioning/runtime/entity-hydration.generated.ts
            src/lib/registry/types.generated.ts
            src/lib/version.ts
            schemas/registry/registry.yaml
            docs/llms.txt
            docs/TYPE-SUMMARY.md
            docs/migration-14.x-rc-worksheet.md
            package.json
          )

          if git diff --exit-code -I '// Generated at:' -I '> Generated at:' -- "${generated_paths[@]}"; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No schema changes detected"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "📋 Schema or registry OpenAPI changes detected"

            ADCP_VERSION=$(node -e "
              const fs = require('fs');
              const index = JSON.parse(fs.readFileSync('schemas/cache/latest/index.json', 'utf8'));
              console.log(index.adcp_version);
            ")
            echo "adcp_version=$ADCP_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Add schema sync changeset
        if: steps.sync.outputs.changes_detected == 'true'
        run: |
          mkdir -p .changeset
          printf '%s\n' \
            '---' \
            "'@adcp/sdk': patch" \
            '---' \
            '' \
            'Synchronize generated AdCP schema and registry types with their configured upstream sources.' \
            > .changeset/sync-generated-schemas-${{ github.run_id }}.md

      - name: Run tests with updated schemas
        if: steps.sync.outputs.changes_detected == 'true'
        run: |
          npm run typecheck
          npm test

      # Use the existing AAO IPR Bot installation identity so the branch push
      # and pull-request events created below trigger the normal downstream
      # workflows. GitHub suppresses those events when they are authored by
      # the default GITHUB_TOKEN. Mint it only after generation and validation
      # so untrusted build steps never receive the installation token.
      - name: Mint schema sync bot token
        if: steps.sync.outputs.changes_detected == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.IPR_APP_ID }}
          private-key: ${{ secrets.IPR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        if: steps.sync.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: |
            chore: sync generated schemas and registry types

            - Refreshed the configured AdCP schema bundles (primary v${{ steps.sync.outputs.adcp_version }})
            - Updated registry OpenAPI types from the configured upstream source
            - Regenerated TypeScript types, fluent API, and reference docs
            - Synchronized AdCP version metadata without bypassing Changesets

            🤖 Generated with [Claude Code](https://claude.ai/code)
          branch: automated/schema-sync-${{ steps.sync.outputs.adcp_version }}
          delete-branch: true
          title: 'chore: sync generated schemas and registry types'
          body: |
            ## 🔄 Automated Schema Synchronization

            This PR synchronizes generated SDK artifacts with the configured AdCP schema bundles (primary v${{ steps.sync.outputs.adcp_version }}) and registry OpenAPI source.

            ### Changes
            - ✅ Refreshed configured signed schemas from `adcontextprotocol.org`
            - ✅ Refreshed the registry OpenAPI from its configured upstream source
            - ✅ Regenerated TypeScript types from official schemas
            - ✅ Updated fluent API with any new tools
            - ✅ Synchronized AdCP compatibility metadata without bypassing Changesets
            - ✅ Regenerated protocol reference docs

            ### Validation
            - ✅ All TypeScript types compile successfully
            - ✅ All tests pass with updated schemas
            - ✅ Package exports are valid

            ### Review Notes
            - This is an automated update from the official AdCP specification
            - Types are generated directly from official JSON schemas
            - Registry OpenAPI syncs may require manual SDK compatibility shims in `src/lib/registry/`
            - Verify registry adopter/type tests before merging
            - Version alignment ensures compatibility tracking

            🤖 Generated with [Claude Code](https://claude.ai/code)
          labels: |
            automated
            schema-sync
            dependencies

      - name: Summary
        run: |
          if [ "${{ steps.sync.outputs.changes_detected }}" == "true" ]; then
            echo "✅ Schema sync completed - PR created for review"
          else
            echo "✅ Schemas are already up to date"
          fi
