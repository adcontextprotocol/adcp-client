services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reporting
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      - '55440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d reporting']
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
