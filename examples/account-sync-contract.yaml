id: account_sync_contract
version: '1.0.0'
title: Natural-key account sync and payment terms
category: account
summary: Verify repeated natural-key sync and agent-billed account responses.
required_tools:
  - sync_accounts
  - list_accounts
invariants:
  - accounts.sync_contract
  - accounts.agent_billing_complete
phases:
  - id: sync
    title: Sync the same sandbox account twice
    steps:
      - id: first_sync
        title: Provision or link an agent-billed account
        task: sync_accounts
        context_outputs:
          - name: certified_account_id
            path: accounts[0].account_id
        sample_request:
          accounts:
            - brand: { domain: 'acme.example' }
              operator: 'agency.example'
              billing: agent
              payment_terms: net_60
              sandbox: true
        validations:
          - check: field_present
            path: accounts[0].account_id
            description: A provisioned account identifier is returned
          - check: field_value
            path: accounts[0].status
            value: active
            description: The sandbox account is active
          - check: field_value
            path: accounts[0].action
            allowed_values: [created, updated, unchanged]
            description: Initial sync succeeds
      - id: repeat_sync
        title: Re-sync the same key with a fresh request key
        task: sync_accounts
        sample_request:
          accounts:
            - brand: { domain: 'acme.example' }
              operator: 'agency.example'
              billing: agent
              payment_terms: net_60
              sandbox: true
        validations:
          - check: field_present
            path: accounts[0].account_id
            description: A provisioned account identifier is returned
          - check: field_value
            path: accounts[0].status
            value: active
            description: The sandbox account is active
          - check: field_value
            path: accounts[0].action
            allowed_values: [updated, unchanged]
            description: Re-sync preserves the existing account
          - check: field_value
            path: accounts[0].account_id
            value: '$context.certified_account_id'
            description: Re-sync returns the same identifier
      - id: list
        title: List the agent-billed sandbox account
        task: list_accounts
        sample_request:
          account:
            brand: { domain: 'acme.example' }
            operator: 'agency.example'
            sandbox: true
          sandbox: true
        validations:
          - check: field_value
            path: accounts[0].account_id
            value: '$context.certified_account_id'
            description: Listing includes the certified account
          - check: field_value
            path: accounts[0].status
            value: active
            description: The listed account remains active
