id: account_sync_contract
version: '1.0.0'
title: Natural-key account sync and payment terms
category: account
summary: Verify repeated natural-key sync and agent-billed account responses.
required_tools:
  - sync_accounts
  - list_accounts
invariants:
  - accounts.sync_contract
  - accounts.agent_billing_complete
phases:
  - id: sync
    title: Sync the same sandbox account twice
    steps:
      - id: first_sync
        title: Provision or link an agent-billed account
        task: sync_accounts
        sample_request:
          accounts:
            - brand: { domain: 'acme.example' }
              operator: 'agency.example'
              billing: agent
              payment_terms: net_60
              sandbox: true
        validations:
          - check: field_present
            path: accounts
            description: Account results are returned
      - id: repeat_sync
        title: Re-sync the same key with a fresh request key
        task: sync_accounts
        sample_request:
          accounts:
            - brand: { domain: 'acme.example' }
              operator: 'agency.example'
              billing: agent
              payment_terms: net_60
              sandbox: true
        validations:
          - check: field_present
            path: accounts
            description: Account results are returned
      - id: list
        title: List the agent-billed sandbox account
        task: list_accounts
        sample_request:
          account:
            brand: { domain: 'acme.example' }
            operator: 'agency.example'
            sandbox: true
          sandbox: true
        validations:
          - check: field_present
            path: accounts
            description: Account results are returned
